name: Build folder diagnostics D2

on:
  workflow_dispatch:
  push:
    paths:
      - 'Diagnostics.m'
      - 'Makefile'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify arm64 dylib
        run: make all
      - uses: actions/upload-artifact@v4
        with:
          name: MSGChatFoldersDiagnostics-D2
          path: |
            build/MSGChatFoldersDiagnostics.dylib
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
