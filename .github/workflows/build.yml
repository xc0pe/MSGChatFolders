name: Build folders prototype F2

on:
  workflow_dispatch:
  push:
    paths:
      - 'Prototype.m'
      - 'Filter.h'
      - 'FilterTests.m'
      - 'Makefile'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check filter behavior
        run: make test
      - name: Compile and verify arm64 dylib
        run: make all
      - uses: actions/upload-artifact@v4
        with:
          name: MSGChatFolders-F2
          path: |
            build/MSGChatFoldersPrototype.dylib
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
